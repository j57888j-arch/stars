services:
  - type: keyvalue
    name: weraqambot-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: weraqambot-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c 'alembic upgrade head && uvicorn app.api.server:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /readyz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: weraqambot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: weraqambot-redis
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: TELEGRAM_STARS_ENABLED
        value: "true"
      - key: REFERRAL_BONUS_STARS
        value: "10"
      - key: PHONE_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true

  - type: worker
    name: weraqambot-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.workers.runner
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: weraqambot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: weraqambot-redis
          property: connectionString
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: TELEGRAM_STARS_ENABLED
        value: "true"
      - key: REFERRAL_BONUS_STARS
        value: "10"
      - key: PHONE_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_IDS
        sync: false

databases:
  - name: weraqambot-db
    plan: basic-256mb
    databaseName: weraqambot
    user: weraqambot
